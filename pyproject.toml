[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "econ-tracker"
version = "0.1.0"
description = "Game Economy Monitoring & Virtual Items Price Tracking Service (Warframe & Rust)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "alembic>=1.14.0,<2.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "httpx[brotli]>=0.27.2,<1.0.0",
    "pyjwt>=2.9.0,<3.0.0",
    "bcrypt>=4.2.0,<5.0.0",
    "typer>=0.12.5,<1.0.0",
    "structlog>=24.4.0,<25.0.0",
    "python-multipart>=0.0.12,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "respx>=0.21.1,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
    "ruff>=0.7.0,<1.0.0",
    "greenlet>=3.1.0,<4.0.0",
]

[project.scripts]
econ-cli = "econ_tracker.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC",
]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["econ_tracker"]

[tool.ruff.lint.per-file-ignores]
"src/econ_tracker/storage/seed.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["alembic.*", "bcrypt.*", "aiosqlite.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "unit: fast unit tests without DB or network",
    "integration: tests with database and FastAPI ASGI client",
    "e2e: full end-to-end user scenario tests",
]

[tool.coverage.run]
source = ["src/econ_tracker"]
omit = ["src/econ_tracker/storage/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
