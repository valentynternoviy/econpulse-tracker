services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-econ}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-econ_password}
      POSTGRES_DB: ${POSTGRES_DB:-econ_tracker}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-econ} -d ${POSTGRES_DB:-econ_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-dev-local-secret-change-in-production-32chars}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-econ}:${POSTGRES_PASSWORD:-econ_password}@db:5432/${POSTGRES_DB:-econ_tracker}
      COLLECT_ENABLED: ${COLLECT_ENABLED:-true}
      LOG_JSON: ${LOG_JSON:-true}
    ports:
      - "8000:8000"

volumes:
  pgdata:
